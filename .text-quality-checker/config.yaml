# =====================================================================
# 原稿チェッカー - 設定ファイル
# =====================================================================

version: 1

user_type: full  # trial / minimal / full

# =====================================================================
# 主な原稿タイプ
# =====================================================================
document_type:
  - blog_article  # note・ブログ記事
  - business_email
  - sns
  - report
  - other

# =====================================================================
# チェックの厳しさ
# =====================================================================
strictness:
  # strict / standard / relaxed
  level: standard

# =====================================================================
# ファクトチェックの深さ
# =====================================================================
fact_check:
  # light / standard / deep
  depth: standard

  # 信頼できるソース（ドメインのホワイトリスト）
  trusted_sources:
    - "*.go.jp"   # 政府機関
    - "*.ac.jp"   # 学術機関
    - "公式サイト"  # サービス提供元の公式サイトを最優先

  # 除外ソース
  blocked_sources: []

  # ソース提示のスタイル
  # always / when_critical_only
  source_citation: always

# =====================================================================
# 一貫性チェックの細かさ
# =====================================================================
consistency:
  check_notation: true       # 表記ゆれ
  check_style: true          # 文体（ですます/である）
  check_numbers: true        # 数値整合
  check_logic: true          # 論理矛盾
  check_definitions: true    # 定義と使用の整合

# =====================================================================
# スタイルガイド
# =====================================================================
style_guide_path: "./style-guide.md"

# =====================================================================
# 出力形式
# =====================================================================
output:
  # detailed / summary / inline
  format: detailed

  # 修正版も同時に出すか（依頼されたときのみ）
  include_revised_version: false

  # 優先度別の件数上限（多すぎると読めない）
  max_critical: 20
  max_warning: 50
  max_info: 30

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  # チェック履歴を残すか（統計・傾向分析用）
  save_check_history: false
  check_history_path: "./check-history.log"
