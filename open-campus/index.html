<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>バーチャルオープンキャンパス｜〇〇動物専門学校</title>
<style>
  :root {
    --purple: #7C3AED;
    --blue: #2563EB;
    --yellow: #FACC15;
    --green: #22C55E;
    --pink: #EC4899;
    --bg: #F4F4F6;
    --ink: #18181B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans JP", "Hiragino Sans", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }

  /* ===== シーン全体 ===== */
  #scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* iOS Safariのツールバー分を除いた実際の可視高さ */
    overflow: hidden;
  }

  /* ===== 360度パノラマ背景 =====
     area.photo に360度写真（エクイレクタングラー形式・横:縦=2:1）の
     パスを入れると実写に切り替わる。null の間は仮背景を自動生成 */
  #pano {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    background: linear-gradient(#c7d2fe, #d6d3d1);
  }
  #pano.dragging { cursor: grabbing; }
  #dragHint {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    border: 2px dashed #A1A1AA;
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 12px;
    font-weight: 700;
    color: #52525B;
    z-index: 15;
    pointer-events: none;
    transition: opacity 0.6s;
  }
  #dragHint.hide { opacity: 0; }

  /* ===== スマホ調整（スマホ優先方針） ===== */

  /* ===== 上部バー ===== */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    z-index: 30;
  }
  #areaBadge {
    background: var(--purple);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 22px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(124,58,237,0.35);
  }
  #mapBtn {
    background: #fff;
    color: var(--ink);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  #mapBtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

  /* ===== キャラクター配置 ===== */
  .char {
    position: absolute;
    bottom: 160px;
    transition: transform 0.4s ease, opacity 0.4s ease;
    z-index: 10;
  }
  #guide2 { left: 3%; width: min(144px, 18.5vw); }
  #guide  { left: calc(3% + min(134px, 17vw)); width: min(130px, 17vw); }
  #dog    { left: calc(3% + min(134px, 17vw) + min(125px, 16vw)); width: min(100px, 13vw); bottom: 155px; }
  #teacher{ right: 4%; width: min(160px, 21vw); opacity: 0; transform: translateX(60px); }
  #teacher.show { opacity: 1; transform: translateX(0); }
  /* 先生ごとの表示サイズ調整：画像の縦横比の違いを補正し、
     見た目の身長をさくら先生(476px)基準に統一。男性の先生は約5%大きめ(500px) */
  #teacher[data-char="mio"]    { width: min(148px, 19.5vw); }
  #teacher[data-char="tanaka"] { width: min(186px, 24vw); }
  #teacher[data-char="daichi"] { width: min(204px, 26.5vw); }
  .char svg, .char img { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.18)); }

  /* 架空キャラクターの明記（誤解防止・常時表示） */
  #aiNote {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    z-index: 21;
    pointer-events: none;
    white-space: nowrap;
  }

  /* しゃべっている人がぴょこっと動く（写真・イラストどちらにも効かせる） */
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-10px); }
  }
  .char.talking svg, .char.talking img { animation: hop 0.5s ease; }
  /* マロンがしゃべる時は、犬らしく2回弾むジャンプ */
  @keyframes dogJump {
    0%, 100% { transform: translateY(0); }
    18% { transform: translateY(-24px); }
    40% { transform: translateY(0); }
    58% { transform: translateY(-14px); }
    78% { transform: translateY(0); }
  }
  #dog.talking svg, #dog.talking img { animation: dogJump 0.7s ease; }
  #teacher.show.talking { transform: translateX(0); }

  /* ===== セリフボックス ===== */
  #dialog {
    position: absolute;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(760px, 92vw);
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 20px 26px 18px;
    box-shadow: 0 6px 0 var(--ink);
    cursor: pointer;
    z-index: 20;
    user-select: none;
  }
  #speakerName {
    position: absolute;
    top: -18px;
    left: 22px;
    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 5px 18px;
    font-size: 14px;
    font-weight: 700;
  }
  #speakerName.teacher-tag { background: var(--green); }
  #speakerName.dog-tag { background: var(--pink); color: #fff; }
  #speakerName.guide2-tag { background: var(--blue); color: #fff; }
  #dialogText {
    font-size: 16px;
    line-height: 1.8;
    min-height: 3.6em;
  }
  #nextHint {
    text-align: right;
    font-size: 12px;
    font-weight: 700;
    color: var(--purple);
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ===== エリア終了時のアクションボタン ===== */
  #actions {
    position: absolute;
    left: 50%;
    bottom: calc(150px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: none;
    gap: 12px;
    z-index: 25;
  }
  #actions.show { display: flex; }
  .action-btn {
    background: var(--purple);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    padding: 13px 26px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .action-btn.secondary { background: #fff; color: var(--ink); }
  .action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
  .action-btn:disabled {
    background: #D4D4D8; color: #71717A;
    box-shadow: 0 4px 0 #A1A1AA; border-color: #A1A1AA;
    cursor: not-allowed;
  }

  /* ===== マップオーバーレイ ===== */
  #mapOverlay {
    position: absolute;
    inset: 0;
    background: rgba(24,24,27,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #mapOverlay.show { display: flex; }
  #mapPanel {
    background: var(--bg);
    border-radius: 32px;
    padding: 30px 34px;
    width: min(680px, 92vw);
    max-height: 86vh;
    overflow-y: auto;
  }
  #mapPanel h2 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  #mapPanel .sub { font-size: 13px; color: #52525B; margin-bottom: 18px; }
  .map-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .map-card {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    font-family: inherit;
    text-align: left;
  }
  .map-card:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
  .map-card .icon { font-size: 30px; }
  .map-card .name { font-weight: 700; font-size: 15px; margin-top: 6px; }
  .map-card .desc { font-size: 12px; color: #52525B; margin-top: 3px; line-height: 1.5; }
  .map-card.locked {
    background: #E4E4E7;
    border-color: #A1A1AA;
    box-shadow: 0 4px 0 #A1A1AA;
    cursor: not-allowed;
    opacity: 0.75;
  }
  .map-card.locked .name::after {
    content: " 準備中";
    font-size: 11px;
    color: var(--pink);
  }
  #closeMap {
    margin-top: 20px;
    width: 100%;
  }

  /* ===== スマホ調整（スマホ優先方針・必ずCSSの最後に置く） ===== */
  @media (max-width: 600px) {
    #dialogText { font-size: 14px; }
    /* キャラを大きく表示。人物はセリフ3行時に足先ギリギリの高さ
       （4行時は足先が少し隠れる・許容済み）。
       マロンだけはセリフボックスに隠れない高さをキープ */
    .char { bottom: 160px; }
    #guide2 { left: 2%; width: 26vw; }
    #guide  { left: calc(2% + 24.5vw); width: 24vw; }
    #dog    { left: calc(2% + 24.5vw + 22.5vw); width: 18vw; bottom: 182px; }
    #teacher { width: 27vw; }
    #teacher[data-char="mio"]    { width: 25vw; }
    #teacher[data-char="tanaka"] { width: 31.5vw; }
    #teacher[data-char="daichi"] { width: 34.5vw; }
    #areaBadge { font-size: 13px; padding: 8px 16px; }
    #mapBtn { font-size: 13px; padding: 8px 16px; }
    #actions { bottom: 220px; flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<div id="scene">
  <!-- 360度パノラマ背景 -->
  <canvas id="pano"></canvas>
  <div id="dragHint">🔄 ドラッグで360度見回せます</div>

  <!-- 上部バー -->
  <div id="topbar">
    <div id="areaBadge">🏫 エントランス</div>
    <button id="mapBtn" onclick="openMap()">🗺️ マップ</button>
  </div>

  <!-- 案内役：あかり（女子学生・ラベンダースクラブ） -->
  <div class="char" id="guide">
    <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
      <!-- 髪（後ろ・ポニーテール） -->
      <path d="M30 42 Q28 72 36 82 L84 82 Q92 72 90 42 Z" fill="#3F3026"/>
      <ellipse cx="96" cy="58" rx="8" ry="17" fill="#3F3026"/>
      <circle cx="97" cy="42" r="4" fill="#F9A8C0"/>
      <!-- 顔 -->
      <circle cx="60" cy="46" r="26" fill="#FCD9B8"/>
      <!-- 前髪 -->
      <path d="M34 42 Q36 18 60 18 Q84 18 86 42 Q74 34 60 36 Q46 34 34 42 Z" fill="#4A3B2E"/>
      <!-- 目 -->
      <circle cx="51" cy="48" r="3" fill="#18181B"/>
      <circle cx="69" cy="48" r="3" fill="#18181B"/>
      <!-- 口（にっこり） -->
      <path d="M54 57 Q60 62 66 57" stroke="#18181B" stroke-width="2" fill="none" stroke-linecap="round"/>

      <circle cx="45" cy="55" r="4" fill="#F9A8C0" opacity="0.7"/>
      <circle cx="75" cy="55" r="4" fill="#F9A8C0" opacity="0.7"/>
      <!-- スクラブ上衣（ラベンダー・Vネック） -->
      <path d="M40 74 Q60 68 80 74 L84 114 Q60 120 36 114 Z" fill="#A78BFA"/>
      <path d="M52 73 L60 82 L68 73" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="63" y="88" width="12" height="10" rx="2" fill="#8B5CF6"/>
      <!-- 腕（右手を上げて案内ポーズ） -->
      <path d="M80 78 Q98 70 102 56" stroke="#FCD9B8" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M40 78 Q30 92 32 102" stroke="#FCD9B8" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- スクラブパンツ -->
      <rect x="44" y="112" width="12" height="28" rx="5" fill="#8B5CF6"/>
      <rect x="62" y="112" width="12" height="28" rx="5" fill="#8B5CF6"/>
      <!-- スニーカー -->
      <ellipse cx="50" cy="142" rx="8" ry="4" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
      <ellipse cx="68" cy="142" rx="8" ry="4" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- 案内役：りく（男子学生・ラベンダースクラブ） -->
  <div class="char" id="guide2">
    <svg viewBox="0 0 120 152" xmlns="http://www.w3.org/2000/svg">
      <!-- 顔 -->
      <circle cx="60" cy="44" r="25" fill="#F5CBA7"/>
      <!-- 短髪 -->
      <path d="M36 42 Q34 14 60 14 Q86 14 84 42 Q78 24 60 26 Q42 24 36 42 Z" fill="#26211C"/>
      <!-- 目 -->
      <circle cx="51" cy="46" r="3" fill="#18181B"/>
      <circle cx="69" cy="46" r="3" fill="#18181B"/>
      <!-- 口（にっと笑顔） -->
      <path d="M53 55 Q60 61 67 55" stroke="#18181B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- スクラブ上衣（ラベンダー・Vネック） -->
      <path d="M38 70 Q60 64 82 70 L86 114 Q60 120 34 114 Z" fill="#A78BFA"/>
      <path d="M52 69 L60 78 L68 69" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="45" y="84" width="12" height="10" rx="2" fill="#8B5CF6"/>
      <!-- 腕（左手を上げて挨拶・あかりと逆側） -->
      <path d="M40 74 Q22 66 18 52" stroke="#F5CBA7" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M80 74 Q90 90 88 100" stroke="#F5CBA7" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- スクラブパンツ -->
      <rect x="44" y="112" width="12" height="30" rx="5" fill="#8B5CF6"/>
      <rect x="62" y="112" width="12" height="30" rx="5" fill="#8B5CF6"/>
      <!-- スニーカー -->
      <ellipse cx="50" cy="144" rx="8" ry="4" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
      <ellipse cx="68" cy="144" rx="8" ry="4" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- 案内役：犬（白いビションフリーゼ。画像未配置時の予備イラスト） -->
  <div class="char" id="dog">
    <svg viewBox="0 0 110 100" xmlns="http://www.w3.org/2000/svg">
      <!-- しっぽ -->
      <circle cx="16" cy="58" r="10" fill="#E8D3B0"/>
      <!-- 体 -->
      <ellipse cx="48" cy="70" rx="30" ry="22" fill="#F0E0C0"/>
      <!-- もこもこ頭 -->
      <circle cx="76" cy="38" r="20" fill="#F0E0C0"/>
      <circle cx="62" cy="28" r="12" fill="#F0E0C0"/>
      <circle cx="88" cy="26" r="11" fill="#F0E0C0"/>
      <circle cx="74" cy="20" r="11" fill="#F0E0C0"/>
      <!-- 耳（垂れ耳もこもこ） -->
      <ellipse cx="58" cy="44" rx="9" ry="14" fill="#E8D3B0"/>
      <ellipse cx="94" cy="44" rx="9" ry="14" fill="#E8D3B0"/>
      <!-- 目 -->
      <circle cx="70" cy="38" r="3" fill="#18181B"/>
      <circle cx="83" cy="38" r="3" fill="#18181B"/>
      <!-- 鼻・口 -->
      <ellipse cx="76" cy="46" rx="5" ry="4" fill="#3F3F46"/>
      <path d="M72 52 Q76 55 80 52" stroke="#3F3F46" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 足 -->
      <rect x="32" y="84" width="9" height="14" rx="4.5" fill="#E8D3B0"/>
      <rect x="56" y="84" width="9" height="14" rx="4.5" fill="#E8D3B0"/>
      <!-- 首輪 -->
      <path d="M60 54 Q76 62 92 54" stroke="#EC4899" stroke-width="5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 先生（エリアごとに登場。見た目はJSのTEACHER_CHARSからキャラ別に注入） -->
  <div class="char" id="teacher"></div>

  <div id="aiNote">案内役の学生・先生・犬は架空のキャラクターです（画像はAI生成を含みます）</div>

  <!-- セリフボックス -->
  <div id="dialog" onclick="nextLine()">
    <div id="speakerName">あかり</div>
    <div id="dialogText"></div>
    <div id="nextHint">▼ クリックで次へ</div>
  </div>

  <!-- エリア終了時のボタン -->
  <div id="actions">
    <button class="action-btn secondary" onclick="openMap()">🗺️ マップを見る</button>
    <button class="action-btn" id="nextAreaBtn" onclick="goNextArea()">次のエリアへ →</button>
  </div>

  <!-- マップ -->
  <div id="mapOverlay">
    <div id="mapPanel">
      <h2>🗺️ キャンパスマップ</h2>
      <div class="sub">見学したい場所を選んでください</div>
      <div class="map-grid" id="mapGrid"></div>
      <button class="action-btn secondary" id="closeMap" onclick="closeMap()">閉じる</button>
    </div>
  </div>
</div>

<script>
// ================================================================
// エリアデータ
// 新しいエリアを追加する時は、この配列にオブジェクトを1つ足すだけ。
// photo: 実際の写真を使う時にパスを入れる（null ならプレースホルダー表示）
// ================================================================
// 方針メモ：
// - 訪問者の個人情報は一切あずからない（入力フォーム・アクセス解析・Cookie・保存なし）
// - 順路：エントランス → トリミング → トレーニング → 看護 → 教室（座学）→ 実地OC案内で締める
// - エリアは1つずつ作って追加していく（lines が空のエリアは「準備中」でロック）
const AREAS = [
  {
    id: "entrance",
    name: "エントランス",
    icon: "🏫",
    desc: "学校の入口。ツアーはここからスタート！",
    photo: "photos/entrance.jpg",
    unlocked: true,
    lines: [
      { speaker: "guide", name: "あかり", text: "ようこそ、〇〇動物専門学校のバーチャルオープンキャンパスへ！ 在校生のあかりです。今日は私たちが校内をご案内します♪" },
      { speaker: "guide2", name: "りく", text: "同じく在校生のりくです！ で、このふわふわの子が、学校のアイドル犬・マロン。よろしくね！" },
      { speaker: "dog", name: "マロン", text: "わんっ！（よろしくね！）" },
      { speaker: "guide", name: "あかり", text: "ここは学校のエントランス。毎朝、モデル犬のワンちゃんたちが元気に「登校」してくる、にぎやかな場所なんですよ。" },
      { speaker: "teacher", char: "tanaka", name: "田中先生（教務）", text: "こんにちは！ 教務担当の田中です。見学に来てくれてありがとうございます。この学校は「動物が好き」な気持ちを、プロの技術に変える場所です。どうぞゆっくり見ていってくださいね。" },
      { speaker: "guide2", name: "りく", text: "それではさっそく、いちばんの見どころ・実習室から行きましょう！ 右上のマップから好きな場所を選ぶこともできますよ。" }
    ]
  },
  // ▼ 新しいエリアはここに追加していく（lines を書けば自動で解放される）
  {
    id: "grooming",
    name: "トリミング実習室",
    icon: "✂️",
    desc: "プロ仕様の設備で実習",
    photo: "photos/grooming.jpg",
    unlocked: true,
    lines: [
      { speaker: "guide", name: "あかり", text: "まずはトリミング実習室！ プロのサロンと同じトリミングテーブルやシャンプー台、ドライヤーがずらっと並んでいます。あ、みお先生！" },
      { speaker: "teacher", char: "mio", name: "みお先生（トリマー担当）", text: "こんにちは、トリマー担当のみおです♪ ここでは、モデル犬たちと一緒にシャンプーからカットまで、実際に手を動かしながら技術を身につけていきますよ。" },
      { speaker: "dog", name: "マロン", text: "わん♪（わたし、ここでカットしてもらうの大好き！）" },
      { speaker: "teacher", char: "mio", name: "みお先生（トリマー担当）", text: "あら、マロンったらもうテーブルの上でスタンバイ？ …それでは特別に、ふんわり仕上げにしてあげますね✂️" },
      { speaker: "dog", name: "マロン", text: "わふ〜ん♪（ふわふわになった〜！）" },
      { speaker: "guide2", name: "りく", text: "在学中にトリマーの資格取得も目指せて、卒業後はサロンや動物病院など進路もいろいろ。詳しい話は、ぜひ実地のオープンキャンパスで聞いてください！" }
    ]

// ================================================================
// 360度パノラマビューア（外部ライブラリ不使用・WebGL直書き）
// 実写に切り替える時：AREAS の photo に 2:1 のエクイレクタングラー
// 画像パス（例 "photos/entrance.jpg"）を入れるだけ。
// ================================================================
const panoCanvas = document.getElementById("pano");
const gl = panoCanvas.getContext("webgl", { antialias: true });
let yaw = 0, pitch = 0, autoRotate = true, texReady = false;
const uni = {};

const VSH = `attribute vec2 aPos; varying vec2 vUV;
void main(){ vUV = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const FSH = `precision mediump float; varying vec2 vUV;
uniform float uYaw,uPitch,uAspect,uFov; uniform sampler2D uTex;
void main(){
  float t = tan(uFov*0.5);
  vec3 d = normalize(vec3(vUV.x*t*uAspect, vUV.y*t, -1.0));
  float cp=cos(uPitch), sp=sin(uPitch);
  d = vec3(d.x, d.y*cp - d.z*sp, d.y*sp + d.z*cp);
  float cy=cos(uYaw), sy=sin(uYaw);
  d = vec3(d.x*cy + d.z*sy, d.y, -d.x*sy + d.z*cy);
  float u = atan(d.x, -d.z)/6.2831853 + 0.5;
  float v = 0.5 - asin(clamp(d.y,-1.0,1.0))/3.1415927;
  gl_FragColor = texture2D(uTex, vec2(u,v));
}`;

function initPano() {
  if (!gl) return;
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ["uYaw","uPitch","uAspect","uFov"].forEach(n => uni[n] = gl.getUniformLocation(prog, n));
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  resizePano();
  requestAnimationFrame(drawPano);
}

function setPanoTexture(source) {
  if (!gl) return;
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  texReady = true;
}

function resizePano() {
  if (!gl) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  panoCanvas.width = panoCanvas.clientWidth * dpr;
  panoCanvas.height = panoCanvas.clientHeight * dpr;
  gl.viewport(0, 0, panoCanvas.width, panoCanvas.height);
}
window.addEventListener("resize", resizePano);

function drawPano() {
  if (gl && texReady) {
    if (autoRotate) yaw += 0.0008;
    gl.uniform1f(uni.uYaw, yaw);
    gl.uniform1f(uni.uPitch, pitch);
    gl.uniform1f(uni.uAspect, panoCanvas.width / panoCanvas.height);
    gl.uniform1f(uni.uFov, (panoCanvas.clientWidth < 600 ? 85 : 72) * Math.PI / 180);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(drawPano);
}

// ドラッグ・スワイプで見回す
let dragging = false, lastX = 0, lastY = 0;
panoCanvas.addEventListener("pointerdown", e => {
  dragging = true;
  autoRotate = false;
  lastX = e.clientX; lastY = e.clientY;
  panoCanvas.classList.add("dragging");
  panoCanvas.setPointerCapture(e.pointerId);
  document.getElementById("dragHint").classList.add("hide");
});
panoCanvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  yaw   += (e.clientX - lastX) * 0.0035;
  pitch += (e.clientY - lastY) * 0.0035;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
["pointerup", "pointercancel"].forEach(ev =>
  panoCanvas.addEventListener(ev, () => {
    dragging = false;
    panoCanvas.classList.remove("dragging");
  })
);

// 仮背景（360度写真が来るまでのプレースホルダー）を自動生成
function makePlaceholderPano(area) {
  const W = 2048, H = 1024;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const horizon = H * 0.62;

  // 天井〜壁
  const g = x.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, "#c7d2fe");
  g.addColorStop(1, "#eef2ff");
  x.fillStyle = g;
  x.fillRect(0, 0, W, horizon);

  // 床
  const f = x.createLinearGradient(0, horizon, 0, H);
  f.addColorStop(0, "#e7e5e4");
  f.addColorStop(1, "#a8a29e");
  x.fillStyle = f;
  x.fillRect(0, horizon, W, H - horizon);

  // 巾木ライン
  x.fillStyle = "rgba(24,24,27,0.2)";
  x.fillRect(0, horizon - 3, W, 6);

  // 床のパース線（奥行き感）
  x.strokeStyle = "rgba(24,24,27,0.08)";
  x.lineWidth = 3;
  for (let i = 0; i <= 32; i++) {
    x.beginPath();
    x.moveTo((W / 32) * i, horizon);
    x.lineTo((W / 32) * i, H);
    x.stroke();
  }

  // 右側に窓
  x.fillStyle = "#bfdbfe";
  x.strokeStyle = "#818cf8";
  x.lineWidth = 6;
  for (const wx of [W * 0.68, W * 0.80]) {
    x.fillRect(wx, H * 0.30, W * 0.08, H * 0.24);
    x.strokeRect(wx, H * 0.30, W * 0.08, H * 0.24);
  }

  // 左側にドア
  x.fillStyle = "#ddd6fe";
  x.strokeStyle = "#7C3AED";
  x.fillRect(W * 0.22, H * 0.28, W * 0.07, H * 0.34);
  x.strokeRect(W * 0.22, H * 0.28, W * 0.07, H * 0.34);

  // 前方の案内パネル
  const label = "📷 ここに「" + area.name + "」の360度写真が入ります";
  x.font = "bold 44px 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif";
  x.textAlign = "center";
  x.textBaseline = "middle";
  const tw = x.measureText(label).width;
  const px = W / 2, py = H * 0.42, pw = tw + 80, ph = 100;
  x.fillStyle = "rgba(255,255,255,0.9)";
  x.strokeStyle = "#A1A1AA";
  x.lineWidth = 4;
  x.setLineDash([14, 10]);
  x.beginPath();
  if (x.roundRect) x.roundRect(px - pw / 2, py - ph / 2, pw, ph, 30);
  else x.rect(px - pw / 2, py - ph / 2, pw, ph);
  x.fill();
  x.stroke();
  x.setLineDash([]);
  x.fillStyle = "#3F3F46";
  x.fillText(label, px, py);

  // 方角の目印
  x.font = "bold 34px 'Noto Sans JP', sans-serif";
  x.fillStyle = "rgba(63,63,70,0.55)";
  x.fillText("ひだり →", W * 0.25, H * 0.20);
  x.fillText("← みぎ", W * 0.75, H * 0.20);
  x.fillText("うしろ", W * 0.03, H * 0.20);
  x.fillText("うしろ", W * 0.97, H * 0.20);

  return c;
}

// 360度写真は area.photo をキーにキャッシュする。
// エリア移動のたびに毎回読み込み直すと、切替の瞬間に仮背景が一瞬見えてしまうため、
// ページ読み込み時に全エリア分を先読みしておき、2回目以降の表示はキャッシュから即座に出す。
const panoCache = {};

function toPOTCanvas(img) {
  // WebGL1は2の累乗サイズしか扱えないため、どんな画像が来ても
  // 2:1の累乗キャンバスに描き直してから使う（サイズ・比率は自由でOK）
  const max = gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 2048;
  const w = max >= 4096 ? 4096 : 2048;
  const pot = document.createElement("canvas");
  pot.width = w;
  pot.height = w / 2;
  pot.getContext("2d").drawImage(img, 0, 0, pot.width, pot.height);
  return pot;
}

function preloadPanoramas() {
  AREAS.forEach(area => {
    if (!area.photo || panoCache[area.photo]) return;
    const img = new Image();
    img.onload = () => { panoCache[area.photo] = toPOTCanvas(img); };
    img.src = area.photo;
  });
}

function setPanorama(area) {
  yaw = 0; pitch = 0; autoRotate = true;
  if (area.photo && panoCache[area.photo]) {
    // 先読み済みならちらつきなく即座に実写へ
    setPanoTexture(panoCache[area.photo]);
    return;
  }
  // 先読みが間に合っていない時だけ、仮背景→読み込み完了後に差し替え
  // （ファイルがまだ無くてもエラーにならず仮背景のまま動く）
  setPanoTexture(makePlaceholderPano(area));
  if (area.photo) {
    const img = new Image();
    img.onload = () => {
      const pot = toPOTCanvas(img);
      panoCache[area.photo] = pot;
      setPanoTexture(pot);
    };
    img.src = area.photo;
  }
}

// ================================================================
// リアル画像への差し替え設定
// chars/ フォルダに画像（背景透過PNG推奨）を置くと、読み込みに成功した
// キャラだけ自動でイラスト→リアル画像に切り替わる（無ければイラストのまま）
// 生成方法は「画像生成ガイド.md」を参照
// ================================================================
// 画像を差し替えたら CHAR_VER の数字を1つ上げる（ブラウザに古いキャッシュを使わせないため）
const CHAR_VER = "?v=2";
const CHAR_IMAGES = {
  guide:  "chars/akari.png" + CHAR_VER,   // あかり（女子学生・案内役）
  guide2: "chars/riku.png" + CHAR_VER,    // りく（男子学生・案内役）
  dog:    "chars/maron.png" + CHAR_VER,   // マロン
  mio:    "chars/mio.png" + CHAR_VER,     // みお先生（トリマー担当）
  tanaka: "chars/tanaka.png" + CHAR_VER,  // 田中先生（教務）
  daichi: "chars/daichi.png" + CHAR_VER,  // 大地先生（トレーニング）
  sakura: "chars/sakura.png" + CHAR_VER   // さくら先生（動物看護）
};

function applyCharImage(elm, path, charKey) {
  if (!path) return;
  const img = new Image();
  img.alt = "";
  img.onload = () => {
    // 読み込み中に別のキャラへ切り替わっていたら差し替えない（表示乱れ防止）
    if (charKey && elm.dataset.char !== charKey) return;
    elm.innerHTML = "";
    elm.appendChild(img);
  };
  img.src = path;
}

// 起動時に全キャラ画像を先読みして、切り替え時のチラつきを抑える
Object.values(CHAR_IMAGES).forEach(p => { new Image().src = p; });

// ================================================================
// ツアー進行ロジック
// ================================================================
let currentAreaIndex = 0;
let currentLineIndex = 0;

const el = {
  badge: document.getElementById("areaBadge"),
  speakerName: document.getElementById("speakerName"),
  dialogText: document.getElementById("dialogText"),
  dialog: document.getElementById("dialog"),
  actions: document.getElementById("actions"),
  nextAreaBtn: document.getElementById("nextAreaBtn"),
  teacher: document.getElementById("teacher"),
  guide: document.getElementById("guide"),
  guide2: document.getElementById("guide2"),
  dog: document.getElementById("dog"),
  mapOverlay: document.getElementById("mapOverlay"),
  mapGrid: document.getElementById("mapGrid")
};

function loadArea(index) {
  const area = AREAS[index];
  currentAreaIndex = index;
  currentLineIndex = 0;
  el.badge.textContent = `${area.icon} ${area.name}`;
  setPanorama(area);
  el.teacher.classList.remove("show");
  el.actions.classList.remove("show");
  el.dialog.style.display = "block";
  showLine();
}

function showLine() {
  const area = AREAS[currentAreaIndex];
  const line = area.lines[currentLineIndex];
  if (!line) return endArea();

  el.speakerName.textContent = line.name;
  el.speakerName.className = "";
  if (line.speaker === "teacher") el.speakerName.classList.add("teacher-tag");
  if (line.speaker === "dog") el.speakerName.classList.add("dog-tag");
  if (line.speaker === "guide2") el.speakerName.classList.add("guide2-tag");
  el.dialogText.textContent = line.text;

  // 先生のセリフになったら、そのキャラの見た目で登場させる
  if (line.speaker === "teacher") {
    if (el.teacher.dataset.char !== line.char) {
      el.teacher.innerHTML = TEACHER_CHARS[line.char] || "";
      el.teacher.dataset.char = line.char;
      applyCharImage(el.teacher, CHAR_IMAGES[line.char], line.char);
    }
    el.teacher.classList.add("show");
  }

  // しゃべる人をぴょこっと動かす
  [el.guide, el.guide2, el.dog, el.teacher].forEach(c => c.classList.remove("talking"));
  const talker = { guide: el.guide, guide2: el.guide2, dog: el.dog, teacher: el.teacher }[line.speaker] || el.guide;
  talker.classList.add("talking");
  setTimeout(() => talker.classList.remove("talking"), 800);
}

function nextLine() {
  currentLineIndex++;
  if (currentLineIndex >= AREAS[currentAreaIndex].lines.length) {
    endArea();
  } else {
    showLine();
  }
}

function endArea() {
  el.dialog.style.display = "none";
  el.actions.classList.add("show");
  // 次の解放済みエリアがあるかチェック（最後まで来たら最初に戻れる）
  const next = AREAS.slice(currentAreaIndex + 1).find(a => a.unlocked);
  el.nextAreaBtn.disabled = false;
  el.nextAreaBtn.textContent = next ? `${next.name}へ →` : "🏫 最初から見る";
}

function goNextArea() {
  const nextIndex = AREAS.findIndex((a, i) => i > currentAreaIndex && a.unlocked);
  loadArea(nextIndex !== -1 ? nextIndex : 0);
}

// ================================================================
// マップ
// ================================================================
function openMap() {
  el.mapGrid.innerHTML = "";
  AREAS.forEach((area, i) => {
    const card = document.createElement("button");
    card.className = "map-card" + (area.unlocked ? "" : " locked");
    card.innerHTML = `<div class="icon">${area.icon}</div><div class="name">${area.name}</div><div class="desc">${area.desc}</div>`;
    if (area.unlocked) {
      card.onclick = () => { closeMap(); loadArea(i); };
    } else {
      card.disabled = true;
    }
    el.mapGrid.appendChild(card);
  });
  el.mapOverlay.classList.add("show");
}
function closeMap() {
  el.mapOverlay.classList.remove("show");
}

// スタート
initPano();
preloadPanoramas();
applyCharImage(el.guide, CHAR_IMAGES.guide);
applyCharImage(el.guide2, CHAR_IMAGES.guide2);
applyCharImage(el.dog, CHAR_IMAGES.dog);
loadArea(0);
</script>
</body>
