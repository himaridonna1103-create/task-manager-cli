<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>himari company — Fantasy Office</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: #2a2048;
    --line: #6b58a8;
    --frame: #3a3560;
    --gold: #e8c15a;
    --text: #efe8ff;
    --sub: #a89ad0;
    --active: #8affb0;
    --glass: rgba(160, 190, 255, .35);
    --tilt: 46deg;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #100b24 0%, #1c1240 55%, #2a1a50 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text);
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    padding: 12px;
    image-rendering: pixelated;
    position: relative;
    overflow-x: hidden;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #stars span { position: absolute; color: #cdbfff; animation: twinkle 3s infinite; }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

  /* ============ アプリ風ウィンドウ ============ */
  .app {
    position: relative; z-index: 1;
    max-width: 1560px; margin: 0 auto;
    border: 3px solid var(--frame); border-radius: 12px;
    background: #16112e; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), 0 0 30px rgba(107,88,168,.25);
  }
  .titlebar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: #1d1838; border-bottom: 2px solid var(--frame);
  }
  .dots { display: flex; gap: 5px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; }
  .dots span:nth-child(1) { background: #ff6b6b; }
  .dots span:nth-child(2) { background: #ffd166; }
  .dots span:nth-child(3) { background: #7CFC98; }
  .titlebar h1 { font-size: 15px; letter-spacing: 1px; color: var(--gold); text-shadow: 0 0 8px rgba(232,193,90,.5); }
  .titlebar .clock { font-size: 12px; color: var(--sub); margin-left: auto; }
  .titlebar .live { font-size: 12px; color: var(--active); }

  .main { display: flex; align-items: stretch; }

  /* ============ 左ナビ（部屋リスト） ============ */
  .nav {
    width: 150px; flex: 0 0 150px; background: #1a1533;
    border-right: 2px solid var(--frame); padding: 12px 8px; font-size: 11px;
  }
  .nav .navtitle { color: var(--sub); font-size: 10px; margin: 6px 4px; }
  .nav .item {
    padding: 4px 8px; cursor: pointer; color: var(--sub); border-radius: 4px;
    display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
  }
  .nav .item:hover { color: #fff; background: rgba(255,255,255,.07); }
  .nav .dot { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 7px; }
  @media (max-width: 1100px) { .nav { display: none; } }

  /* ============ フロア ============ */
  .floorwrap { flex: 1 1 auto; min-width: 0; padding: 14px; overflow-x: auto; }
  .floor { display: flex; gap: 10px; align-items: stretch; min-width: 660px; }
  .col { flex: 1 1 0; display: flex; flex-direction: column; gap: 10px; }
  .col.center { flex: 1.06 1 0; }

  .zone {
    position: relative; flex: 1 0 auto;
    border: 2px solid var(--glass); border-radius: 6px;
    background: rgba(34,26,66,.8);
    padding: 24px 6px 8px;
    box-shadow: inset 0 0 24px rgba(120,90,220,.15), 0 3px 0 rgba(0,0,0,.35);
    perspective: 820px;
  }
  .zone::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 11px;
    background: #4a3a63; border-radius: 4px 4px 0 0; border-bottom: 2px solid #241b3d;
  }
  .zone h2 {
    position: absolute; top: -3px; left: 8px; z-index: 3;
    font-size: 11px; padding: 1px 8px; background: #1d1838;
    border: 2px solid; border-radius: 4px; white-space: nowrap;
  }
  .zone .desks {
    display: flex; flex-wrap: wrap; gap: 4px 6px; justify-content: center; align-items: flex-end;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%),
      linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%);
    background-size: 22px 22px; background-position: 0 0, 11px 11px;
    border-radius: 4px; padding: 6px 2px 4px; min-height: 100px;
    transform-style: preserve-3d;
  }
  .zone .plant { position: absolute; bottom: 6px; right: 4px; opacity: .9; pointer-events: none; }
  .billboard { transform-style: preserve-3d; transform-origin: bottom center; transform: rotateX(calc(-1 * var(--tilt))); }

  /* --- 3Dステージ（床の傾き＋奥の壁） --- */
  .room3d {
    position: relative;
    transform-style: preserve-3d; transform-origin: bottom center; transform: rotateX(var(--tilt));
  }
  .room3d::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    border-radius: 4px; background: linear-gradient(0deg, rgba(0,0,0,.32) 0%, transparent 55%);
  }
  .room3d .deskwall {
    position: absolute; top: 0; left: 0; right: 0; height: 32px; z-index: 0;
    transform-origin: top; transform: rotateX(90deg);
    border-radius: 4px 4px 0 0;
    box-shadow: inset 0 -12px 16px rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.18);
  }

  /* ============ 受付ホール ============ */
  .zone.entry { text-align: center; }
  .sign {
    margin: 2px auto 6px; max-width: 250px;
    background: linear-gradient(180deg, #101a3a, #182552);
    border: 2px solid #3f5da8; border-radius: 6px; padding: 7px 10px;
    box-shadow: 0 0 14px rgba(90,140,255,.35), inset 0 0 18px rgba(90,140,255,.15);
  }
  .sign .signtitle {
    font-size: 15px; letter-spacing: 2px; color: #9fd8ff;
    text-shadow: 0 0 10px rgba(120,190,255,.9);
  }
  .sign .signsub { font-size: 10px; color: #6f8fd0; margin-top: 2px; letter-spacing: 1px; }
  .motto {
    margin: 6px auto 2px; font-size: 11px; color: var(--gold);
    background: rgba(0,0,0,.3); border: 2px solid rgba(232,193,90,.45);
    border-radius: 4px; padding: 3px 8px; display: inline-block;
  }

  /* ============ 休憩ラウンジ ============ */
  .lounge-inner {
    display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding: 8px 0 4px;
    transform-style: preserve-3d;
  }
  .lounge-inner .zzz { font-size: 14px; animation: floaty 3s ease-in-out infinite; }

  /* ============ デスク ============ */
  .desk {
    width: 100px; text-align: center; position: relative;
    padding: 6px 2px 4px; border: 2px solid transparent; border-radius: 4px;
    cursor: pointer; user-select: none;
    transform-style: preserve-3d;
  }
  .desk:hover { background: rgba(255,255,255,.05); }
  .desk .sprite { height: 92px; display: flex; align-items: flex-end; justify-content: center; }
  .desk .dogimg { max-height: 92px; max-width: 100px; object-fit: contain; }
  .desk.active .dogimg { animation: bob 0.8s steps(2) infinite; }
  .desk .name { font-size: 10px; margin-top: 4px; line-height: 1.25; word-break: break-all; }
  .desk .breed { font-size: 9px; color: var(--gold); margin-top: 1px; opacity: .85; }
  .desk.active {
    border-color: var(--active);
    background: radial-gradient(circle at 50% 60%, rgba(138,255,176,.22), transparent 70%);
    box-shadow: 0 0 12px rgba(138,255,176,.45);
  }
  .desk.active .name { color: var(--active); }
  .desk .badge {
    display: none; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--active); color: #0e331c; font-size: 9px; padding: 0 5px;
    border: 2px solid #0e331c; white-space: nowrap; z-index: 4;
  }
  .desk.active .badge { display: block; animation: pop .6s infinite alternate; }
  @keyframes pop { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-3px); } }

  /* --- 実績カード（ホバーで表示） --- */
  .statcard {
    display: none; position: absolute; bottom: calc(100% - 4px); left: 50%; transform: translateX(-50%);
    background: #f5f0ff; color: #2a2044; border: 2px solid var(--line); border-radius: 4px;
    font-size: 9px; line-height: 1.5; padding: 3px 7px; white-space: nowrap; z-index: 9; text-align: left;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  .statcard b { color: #4a3690; }
  .desk:hover .statcard { display: block; }

  /* --- 働いている様子 --- */
  .desk.active svg .dog { animation: bob 0.8s steps(2) infinite; }
  @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } 100% { transform: translateY(0); } }
  .desk.active svg .ball { fill: #aef2c8; filter: drop-shadow(0 0 5px #8affb0); animation: glowpulse 1.2s infinite alternate; }
  @keyframes glowpulse { from { filter: drop-shadow(0 0 3px #8affb0); } to { filter: drop-shadow(0 0 8px #8affb0); } }
  .desk.active::after {
    content: "✦"; position: absolute; top: 2px; right: 4px; color: var(--active);
    font-size: 11px; animation: twinkle 1s infinite;
  }
  .desk.active svg .paw1 { animation: type .28s steps(2) infinite; }
  .desk.active svg .paw2 { animation: type .28s steps(2) .14s infinite; }
  @keyframes type { 0% { transform: translateY(0); } 50% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
  .workbubble {
    display: none; position: absolute; top: 10px; left: 1px;
    background: #d3ffe0; color: #0e331c; border: 2px solid #0e331c;
    font-size: 8px; padding: 0 3px; z-index: 4;
  }
  .desk.active .workbubble { display: block; animation: pop2 .9s steps(2) infinite; }
  @keyframes pop2 { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } 100% { transform: translateY(0); } }
  .idlebubble {
    position: absolute; top: 0; left: 4px; font-size: 13px;
    opacity: 0; transition: opacity .5s; z-index: 4; pointer-events: none;
  }
  .idlebubble.show { opacity: 1; }
  svg .eyes { animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 91%, 100% { opacity: 1; } 93%, 97% { opacity: 0; } }
  svg .flame { animation: flicker 1.4s infinite; }
  @keyframes flicker { 0%,100% { opacity: .95; } 40% { opacity: .55; } 70% { opacity: .85; } }

  /* --- クリック反応 --- */
  .desk.jump svg .dog { animation: jumpy .55s ease-out; }
  @keyframes jumpy {
    0% { transform: translateY(0); } 30% { transform: translateY(-9px); }
    55% { transform: translateY(0); } 75% { transform: translateY(-4px); } 100% { transform: translateY(0); }
  }
  .speech {
    display: none; position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    background: #fff8e0; color: #4a3a10; border: 2px solid #8a6a20;
    font-size: 9px; padding: 1px 6px; white-space: nowrap; z-index: 10;
  }
  .speech.show { display: block; animation: pop2 .5s steps(2) infinite; }
  .heart {
    position: absolute; left: 50%; top: 26px; font-size: 13px; color: #ff8fa3;
    animation: rise 1s ease-out forwards; pointer-events: none; z-index: 5;
  }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -26px); } }

  .prop { display: flex; align-items: flex-end; padding: 0 2px 6px; opacity: .95; transform-style: preserve-3d; }
  .prop.floaty svg, .floaty { animation: floaty 3s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* --- 廊下を歩くワンちゃん --- */
  #walkerWrap { position: fixed; bottom: 4px; left: 0; width: 100%; height: 70px; pointer-events: none; z-index: 20; }
  #walker { position: absolute; bottom: 0; left: -130px; }
  #walker.walking { animation: cross 20s linear forwards; }
  @keyframes cross { from { left: -130px; } to { left: 104%; } }
  #walker svg { animation: hop .45s steps(2) infinite; }
  @keyframes hop { 0% { transform: translateY(0); } 50% { transform: translateY(-3px); } 100% { transform: translateY(0); } }

  /* ============ 右サイドバー ============ */
  .sidebar {
    width: 270px; flex: 0 0 270px; background: #1a1533;
    border-left: 2px solid var(--frame); padding: 12px 10px;
    display: flex; flex-direction: column; gap: 12px;
  }
  @media (max-width: 900px) { .main { flex-wrap: wrap; } .sidebar { width: 100%; flex: 1 1 100%; border-left: none; border-top: 2px solid var(--frame); } }
  .panel {
    border: 2px solid var(--line); background: var(--panel);
    border-radius: 6px; padding: 8px 10px;
  }
  .panel h3 { font-size: 12px; color: var(--gold); margin-bottom: 6px; }
  .stats { display: flex; gap: 8px; }
  .stat { flex: 1; text-align: center; background: rgba(0,0,0,.3); border-radius: 4px; padding: 6px 2px; }
  .stat .num { font-size: 20px; color: #fff; }
  .stat .lbl { font-size: 9px; color: var(--sub); margin-top: 2px; }
  .nowlist { font-size: 11px; line-height: 1.7; }
  .nowlist .none { color: var(--sub); }
  .nowlist .on { color: var(--active); }
  .loglist { font-size: 10px; line-height: 1.8; max-height: 260px; overflow-y: auto; }
  .loglist .t { color: var(--sub); margin-right: 5px; }
  .loglist .start { color: var(--active); }
  .loglist .stop { color: #ff9ea0; }
  .foot { font-size: 9px; color: var(--sub); margin-top: 8px; }
  button.demo {
    font-family: inherit; font-size: 11px; cursor: pointer;
    background: var(--gold); color: #33280a; border: 3px solid #33280a;
    border-radius: 4px; padding: 4px 10px; margin-top: 6px;
  }
  button.demo:active { transform: translateY(2px); }
</style>
</head>
<body>
<div id="stars"></div>
<div id="walkerWrap"><div id="walker"></div></div>

<div class="app">
  <div class="titlebar">
    <div class="dots"><span></span><span></span><span></span></div>
    <h1>✦ himari company</h1>
    <a href="story.html" style="color:var(--gold);font-size:11px;text-decoration:none;border:2px solid var(--gold);border-radius:4px;padding:1px 8px">📖 ものがたり</a>
    <span class="live" id="liveState">● 待機中</span>
    <span class="clock" id="clock"></span>
  </div>
  <div class="main">
    <nav class="nav" id="nav">
      <div class="navtitle">— フロアマップ —</div>
    </nav>
    <div class="floorwrap"><div class="floor" id="floor"></div></div>
    <div class="sidebar">
      <div class="panel">
        <h3>✦ 本日の勤怠</h3>
        <div class="stats">
          <div class="stat"><div class="num" id="stToday">0</div><div class="lbl">今日の稼働</div></div>
          <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">累計稼働</div></div>
          <div class="stat"><div class="num" id="stActive">0</div><div class="lbl">現在稼働中</div></div>
        </div>
      </div>
      <div class="panel">
        <h3>✦ いま働いているワンちゃん</h3>
        <div class="nowlist" id="nowList"><span class="none">全員お昼寝中…💤</span></div>
      </div>
      <div class="panel">
        <h3>✦ 出勤ログ</h3>
        <div class="loglist" id="logList"><span class="t">まだログがありません</span></div>
      </div>
      <div class="panel">
        <h3>✦ 操作</h3>
        <button class="demo" id="demoBtn">デモ再生（動きを確認）</button>
        <div class="foot">データは5秒ごとに自動更新。<br>デスクにマウスを乗せると実績カード、クリックでご挨拶🐾</div>
      </div>
    </div>
  </div>
</div>

// イベント名 → デスクの対応（チーム所属エージェントは班のデスクへ）
function resolveDesk(rawName) {
  if (!rawName) return null;
  let n = String(rawName).toLowerCase().trim();
  const all = new Set(ROOMS.flatMap(r => r.members.map(m => m.id)));
  const tryName = (x) => all.has(x) ? x : null;
  if (tryName(n)) return n;
  if (n.endsWith("-advocate")) { const b = tryName(n.replace(/-advocate$/, "")); if (b) return b; }
  if (n.startsWith("slide-")) return "slide-maker";
  if (n.startsWith("report-")) return "report-writer";
  if (n.startsWith("bizdev-")) return "bizdev-strategist";
  if (n.startsWith("crew-") || n.startsWith("writing-crew")) return "writing-crew-starter";
  if (n.startsWith("anken-coach")) return "anken-coach-elite";
  if (n === "executive-secretary") return "secretary";
  if (n.includes("meeting-summar")) return "meeting-summarizer";
  return "claude"; // 不明なものは所長席へ
}

// ============ ドット絵SVG生成 ============
function hashCode(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }

function dogRects(id, P, offX) {
  const br = BREEDS[id] || { b:"ミックス", a:"floppy", C:"#c98a4b", D:"#8a5a2b", M:"#f2e6d0" };
  const map = ARCHETYPES[br.a];
  const h = hashCode(id);
  const colorOf = (c, x, y) => {
    if (c === "M") return br.M || br.C;
    if (c === "F") return br.F || br.C;
    if (c === "D") return br.D || br.C;
    if (br.spots && ((x * 7 + y * 13 + h) % 8 === 0)) return br.D;
    return br.C;
  };
  let body = "", eyes = "";
  map.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (c === ".") return;
      if (c === "E") { eyes += `<rect x="${x*P+offX}" y="${y*P}" width="${P}" height="${P}" fill="#1e1a14"/>`; return; }
      if (c === "N") { body += `<rect x="${x*P+offX}" y="${y*P}" width="${P}" height="${P}" fill="#26201a"/>`; return; }
      body += `<rect x="${x*P+offX}" y="${y*P}" width="${P}" height="${P}" fill="${colorOf(c,x,y)}"/>`;
    });
  });
  return { body, eyes, rows: map.length, br };
}

function spriteSVG(id) {
  const P = 6;
  const W = 14 * P;
  const offX = (W - 12 * P) / 2;
  const d = dogRects(id, P, offX);
  const deskY = d.rows * P - P * 0.4;
  const pawC = d.br.M || d.br.C;
  return `<svg width="${W}" height="${deskY + 2.2*P}" xmlns="http://www.w3.org/2000/svg">
    <g class="dog">${d.body}<g class="eyes" style="animation-delay:${(hashCode(id)%40)/10}s">${d.eyes}</g></g>
    <rect x="0" y="${deskY}" width="${W}" height="${1.2*P}" fill="#7a5a36"/>
    <rect x="0" y="${deskY+1.2*P}" width="${W}" height="${0.7*P}" fill="#5c4228"/>
    <rect class="paw1" x="${5.2*P}" y="${deskY-0.6*P}" width="${1*P}" height="${0.6*P}" fill="${pawC}"/>
    <rect class="paw2" x="${7.6*P}" y="${deskY-0.6*P}" width="${1*P}" height="${0.6*P}" fill="${pawC}"/>
    <rect x="${2.6*P}" y="${deskY-0.5*P}" width="${1.8*P}" height="${0.5*P}" fill="#4a3a58"/>
    <circle class="ball" cx="${3.5*P}" cy="${deskY-1.5*P}" r="${1.2*P}" fill="#5a4f7d"/>
    <rect x="${10.2*P}" y="${deskY-1.5*P}" width="${0.8*P}" height="${1.5*P}" fill="#e8e0d0"/>
    <rect class="flame" x="${10.3*P}" y="${deskY-2.3*P}" width="${0.6*P}" height="${0.8*P}" fill="#ffb347"/>
  </svg>`;
}

function walkerSVG(id) {
  const P = 5;
  const d = dogRects(id, P, 0);
  return `<svg width="${12*P}" height="${d.rows*P}" xmlns="http://www.w3.org/2000/svg">${d.body}${d.eyes}</svg>`;
}

function pixelSVG(prop, P) {
  P = P || 5;
  const map = prop.map, pal = prop.pal;
  const w = Math.max(...map.map(r => r.length)) * P;
  let rects = "";
  map.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (c === "." || !pal[c]) return;
      rects += `<rect x="${x*P}" y="${y*P}" width="${P}" height="${P}" fill="${pal[c]}"/>`;
    });
  });
  return `<svg width="${w}" height="${map.length*P}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

function react(id, desk) {
  desk.classList.remove("jump");
  void desk.offsetWidth;
  desk.classList.add("jump");
  setTimeout(() => desk.classList.remove("jump"), 600);

  const lines = SPEAK[id] || SPEAK_FALLBACK;
  const speech = desk.querySelector(".speech");
  speech.textContent = Math.random() < 0.15
    ? SPEAK_FALLBACK[Math.floor(Math.random() * SPEAK_FALLBACK.length)]
    : lines[Math.floor(Math.random() * lines.length)];
  speech.classList.add("show");
  clearTimeout(speech._t);
  speech._t = setTimeout(() => speech.classList.remove("show"), 1900);

  const h = document.createElement("span");
  h.className = "heart";
  h.textContent = "♥";
  (desk.querySelector(".billboard") || desk).appendChild(h);
  setTimeout(() => h.remove(), 1000);
}

// ============ 星空 ============
const stars = document.getElementById("stars");
for (let i = 0; i < 70; i++) {
  const s = document.createElement("span");
  s.textContent = Math.random() < 0.3 ? "✦" : "·";
  s.style.left = Math.random() * 100 + "%";
  s.style.top = Math.random() * 100 + "%";
  s.style.fontSize = (8 + Math.random() * 8) + "px";
  s.style.animationDelay = (Math.random() * 3) + "s";
  stars.appendChild(s);
}

// ============ 休憩中の吹き出し（ランダム） ============
const IDLE_EMOJI = ["💤", "☕", "🦴", "📖", "🐾", "🎾"];
setInterval(() => {
  const idle = [...document.querySelectorAll(".desk:not(.active)")];
  if (!idle.length) return;
  const el = idle[Math.floor(Math.random() * idle.length)];
  const bub = el.querySelector(".idlebubble");
  if (!bub || bub.classList.contains("show")) return;
  bub.textContent = IDLE_EMOJI[Math.floor(Math.random() * IDLE_EMOJI.length)];
  bub.classList.add("show");
  setTimeout(() => bub.classList.remove("show"), 2200);
}, 1800);

// ============ 廊下を歩くワンちゃん ============
const walker = document.getElementById("walker");
function sendWalker() {
  const ids = Object.keys(BREEDS);
  const id = ids[Math.floor(Math.random() * ids.length)];
  walker.innerHTML = walkerSVG(id);
  walker.classList.remove("walking");
  void walker.offsetWidth;
  walker.classList.add("walking");
}
setTimeout(sendWalker, 6000);
setInterval(sendWalker, 48000);

// ============ データ読み込み（5秒ごと） ============
let demoMode = false;
function reloadData() {
  if (demoMode) return;
  ["office_status", "office_log"].forEach(f => {
    const old = document.getElementById("js-" + f);
    if (old) old.remove();
    const s = document.createElement("script");
    s.id = "js-" + f;
    s.src = `data/${f}.js?t=${Date.now()}`;
    s.onload = render;
    document.body.appendChild(s);
  });
}

function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "--:--";
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function render() {
  const status = window.OFFICE_STATUS || { active: [] };
  const log = window.OFFICE_LOG || [];
  const activeDesks = new Map();
  (status.active || []).forEach(a => {
    const d = resolveDesk(a.name);
    if (d) activeDesks.set(d, a.name);
  });

  document.querySelectorAll(".desk").forEach(el => {
    el.classList.toggle("active", activeDesks.has(el.id.replace("desk-", "")));
  });

  const d0 = new Date();
  const localDate = (t) => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  const localToday = localDate(d0);
  const starts = log.filter(e => e.ev === "start");
  document.getElementById("stTotal").textContent = starts.length;
  document.getElementById("stToday").textContent = starts.filter(e => {
    const t = new Date(e.t);
    return !isNaN(t) && localDate(t) === localToday;
  }).length;
  document.getElementById("stActive").textContent = activeDesks.size;

  // デスクごとの実績（累計・今日・最終出勤）
  const perDesk = {}, perDeskToday = {}, lastSeen = {};
  starts.forEach(e => {
    const d = resolveDesk(e.name);
    if (!d) return;
    perDesk[d] = (perDesk[d] || 0) + 1;
    const t = new Date(e.t);
    if (!isNaN(t)) {
      if (localDate(t) === localToday) perDeskToday[d] = (perDeskToday[d] || 0) + 1;
      if (!lastSeen[d] || t > lastSeen[d]) lastSeen[d] = t;
    }
  });
  document.querySelectorAll(".statcard").forEach(el => {
    const id = el.id.replace("stat-", "");
    const br = BREEDS[id];
    const last = lastSeen[id]
      ? `${String(lastSeen[id].getHours()).padStart(2,"0")}:${String(lastSeen[id].getMinutes()).padStart(2,"0")}`
      : "--:--";
    el.innerHTML = `<b>${br ? br.b : id}</b><br>今日 ${perDeskToday[id] || 0}回 ・ 累計 ${perDesk[id] || 0}回<br>最終出勤 ${last}`;
  });

  const nowList = document.getElementById("nowList");
  if (activeDesks.size === 0) {
    nowList.innerHTML = '<span class="none">全員お昼寝中…💤</span>';
    document.getElementById("liveState").textContent = "● 待機中";
    document.getElementById("liveState").style.color = "var(--sub)";
  } else {
    nowList.innerHTML = [...activeDesks.values()].map(n => `<div class="on">▶ ${n}</div>`).join("");
    document.getElementById("liveState").textContent = "● 稼働中";
    document.getElementById("liveState").style.color = "var(--active)";
  }

  const logList = document.getElementById("logList");
  if (log.length) {
    logList.innerHTML = log.slice(-20).reverse().map(e =>
      `<div><span class="t">${fmtTime(e.t)}</span><span class="${e.ev === "start" ? "start" : "stop"}">${e.ev === "start" ? "出勤" : "退勤"}</span> ${e.name}</div>`
    ).join("");
  }
}

// ============ 時計 ============
setInterval(() => {
  const d = new Date();
  document.getElementById("clock").textContent =
    `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ` +
    `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
}, 500);

// ============ デモ再生 ============
document.getElementById("demoBtn").addEventListener("click", () => {
  demoMode = true;
  const ids = ROOMS.flatMap(r => r.members.map(m => m.id));
  const pick = () => ids[Math.floor(Math.random() * ids.length)];
  const now = () => new Date().toISOString();
  window.OFFICE_LOG = window.OFFICE_LOG || [];
  let step = 0;
  let current = [];
  const timer = setInterval(() => {
    step++;
    const someone = pick();
    current.push(someone);
    if (current.length > 3) current.shift();
    window.OFFICE_LOG.push({ t: now(), name: someone, ev: "start" });
    window.OFFICE_STATUS = { active: current.map(n => ({ name: n, since: now() })), updated: now() };
    if (step > 2) window.OFFICE_LOG.push({ t: now(), name: current[0], ev: "stop" });
    render();
    if (step >= 7) {
      clearInterval(timer);
      window.OFFICE_STATUS = { active: [] };
      render();
      demoMode = false;
    }
  }, 1500);
});

reloadData();
setInterval(reloadData, 5000);
</script>
</body>
