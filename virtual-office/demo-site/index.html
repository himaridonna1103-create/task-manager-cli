<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陽だまりの丘の、ちいさなオフィス — HIMARI COMPANY</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4a3a2a;
    --paper: #faf6ec;
    --paper2: #f2ead8;
    --gold: #c9962e;
    --terra: #b5642e;
    --night: #241a30;
    --nightink: #f0dfb8;
    --tilt: 28deg;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Shippori Mincho', serif;
    color: var(--ink);
    background: var(--paper);
    overflow-x: hidden;
  }
  .pixel { font-family: 'DotGothic16', monospace; }
  .billboard { transform-style: preserve-3d; transform-origin: bottom center; transform: rotateX(calc(-1 * var(--tilt))); }
  .dogsvg { filter: drop-shadow(0 1px 2px rgba(74,58,42,.45)); }

  /* ============ 固定ヘッダー・時刻メーター ============ */
  .brandbar {
    position: fixed; top: 0; left: 0; z-index: 50; padding: 16px 22px;
    mix-blend-mode: multiply;
  }
  .brandbar .b1 { font-size: 15px; letter-spacing: 5px; font-weight: 700; }
  .brandbar .b2 { font-size: 9px; letter-spacing: 3px; opacity: .65; margin-top: 3px; }
  .timemeter {
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
    z-index: 50; text-align: right; mix-blend-mode: multiply;
  }
  .timemeter .tm-time { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .timemeter .tm-label { font-size: 10px; letter-spacing: 2px; opacity: .7; margin-top: 2px; }
  .timemeter .tm-line { width: 1px; height: 130px; background: currentColor; opacity: .4; margin: 14px 6px 14px auto; }
  .timemeter .tm-foot { font-size: 9px; letter-spacing: 3px; opacity: .6; }
  @media (max-width: 760px) { .timemeter { display: none; } }

  /* ============ ヒーロー（陽だまりの空） ============ */
  .hero {
    min-height: 100vh; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #aed4ea 0%, #cfe4e2 30%, #f5e2b8 62%, #f7cf8e 82%, #eab975 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 90px 16px 0;
  }
  .sun {
    position: absolute; top: 10%; right: 14%; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fff3d0 0%, #ffd97a 55%, rgba(255,217,122,0) 72%);
    box-shadow: 0 0 80px 40px rgba(255,220,140,.55);
    animation: sunpulse 6s ease-in-out infinite;
  }
  @keyframes sunpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .cloud {
    position: absolute; background: rgba(255,255,255,.85); border-radius: 40px;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 45%; height: 160%; left: 18%; top: -70%; }
  .cloud::after { width: 35%; height: 120%; right: 16%; top: -45%; }
  @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(calc(100vw + 160px)); } }
  .petal {
    position: absolute; font-size: 13px; color: #e8a825; opacity: .8;
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-40px) rotate(0deg); }
    to { transform: translateY(105vh) rotate(360deg); }
  }

  /* --- 断面図の建物 --- */
  .buildingwrap { position: relative; z-index: 2; margin-top: 8px; }
  .building {
    width: min(560px, 92vw);
    background: #3d2c22;
    border-radius: 46% 46% 14px 14px / 22% 22% 14px 14px;
    padding: 30px 16px 16px;
    box-shadow: 0 22px 50px rgba(80,50,20,.4);
  }
  .building .roof {
    text-align: center; color: #e8c15a; font-size: 11px; letter-spacing: 3px;
    margin-bottom: 12px; font-family: 'DotGothic16', monospace;
  }
  .floors { display: flex; flex-direction: column; gap: 8px; }
  .brow { display: flex; gap: 8px; }
  .broom {
    flex: 1; position: relative; min-height: 96px; border-radius: 5px;
    padding: 6px 4px 0; overflow: hidden;
    box-shadow: inset 0 0 18px rgba(60,30,10,.35);
    perspective: 260px;
  }
  .broomfloor {
    position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: 6px;
    display: flex; align-items: flex-end; justify-content: center; gap: 2px;
    transform-style: preserve-3d; transform-origin: bottom center; transform: rotateX(var(--tilt));
  }
  .broom .rname {
    position: absolute; top: 3px; left: 6px; font-size: 9px;
    font-family: 'DotGothic16', monospace; opacity: .9; z-index: 2;
  }
  .broom .lampglow {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 70px; height: 36px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,240,185,.5), transparent 70%);
    animation: lampf 4.5s ease-in-out infinite;
  }
  @keyframes lampf { 0%,100% { opacity: .9; } 50% { opacity: .55; } }
  .broom svg { transform: scale(.78); transform-origin: bottom center; }
  .caption-chip {
    position: relative; z-index: 2; margin-top: -12px;
    background: #2a1d16; color: #f0dfb8; font-size: 12px; letter-spacing: 2px;
    padding: 5px 18px; border-radius: 20px;
    font-family: 'DotGothic16', monospace;
  }

  /* --- ひまわり --- */
  .flowers { position: absolute; bottom: -6px; left: 0; width: 100%; display: flex; justify-content: space-around; z-index: 1; }
  .flowers svg { animation: sway 4s ease-in-out infinite; transform-origin: bottom center; }
  .flowers svg:nth-child(2n) { animation-delay: 1.3s; }
  .flowers svg:nth-child(3n) { animation-delay: 2.1s; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  .hero-copy { position: relative; z-index: 2; text-align: center; padding: 46px 10px 120px; }
  .hero-copy .lead { font-size: 13px; letter-spacing: 4px; margin-bottom: 26px; opacity: .8; }
  .hero-copy h1 { font-size: clamp(34px, 7vw, 58px); font-weight: 700; letter-spacing: 6px; line-height: 1.5; }
  .hero-copy .sub { margin-top: 26px; font-size: 12px; letter-spacing: 3px; opacity: .7; }
  .scrollhint { margin-top: 34px; font-size: 11px; letter-spacing: 3px; opacity: .6; animation: hintbob 2s ease-in-out infinite; }
  @keyframes hintbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

  /* ============ 紙のセクション ============ */
  .papersec { background: var(--paper); padding: 90px 18px; }
  .papersec.alt { background: var(--paper2); }
  .inner { max-width: 940px; margin: 0 auto; }
  .seckicker { text-align: center; font-size: 11px; letter-spacing: 5px; color: var(--gold); margin-bottom: 14px; }
  .sechead { text-align: center; font-size: clamp(22px, 4vw, 32px); font-weight: 700; letter-spacing: 4px; margin-bottom: 14px; }
  .secnote { text-align: center; font-size: 13px; letter-spacing: 2px; opacity: .8; margin-bottom: 50px; line-height: 2; }

  /* --- フロア一覧 --- */
  .dirgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 50px; max-width: 760px; margin: 0 auto; }
  @media (max-width: 640px) { .dirgrid { grid-template-columns: 1fr; } }
  .dirrow {
    display: flex; align-items: baseline; gap: 14px;
    border-bottom: 1px solid rgba(74,58,42,.25); padding: 14px 4px;
    cursor: pointer; transition: background .25s, padding-left .25s;
  }
  .dirrow:hover { background: rgba(201,150,46,.09); padding-left: 12px; }
  .dirrow:hover .dn { color: var(--gold); }
  .dirrow::after { content: "→"; font-size: 12px; opacity: 0; transition: opacity .25s; color: var(--gold); }
  .dirrow:hover::after { opacity: 1; }
  .dirrow .df { font-size: 13px; font-weight: 700; color: var(--gold); min-width: 30px; }
  .dirrow .dn { font-size: 15px; letter-spacing: 2px; }
  .dirrow .dc { margin-left: auto; font-size: 12px; opacity: .7; }

  /* --- 部署カード --- */
  .dept { max-width: 940px; margin: 0 auto 70px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 14px 40px rgba(120,90,40,.14); }
  .scene { position: relative; height: 240px; overflow: hidden; perspective: 560px; }
  .scene .scenefloor { position: absolute; bottom: 0; left: 0; width: 100%; height: 34px; background: #a5713d; }
  .scene .scenefloor::after { content: ""; position: absolute; top: 0; width: 100%; height: 7px; background: rgba(255,255,255,.15); }
  .scene .win {
    position: absolute; top: 26px; right: 40px; width: 110px; height: 84px;
    background: linear-gradient(180deg, #b8dcec 0%, #e8ecc8 70%, #f2d898 100%);
    border: 7px solid #7a5a36; border-radius: 8px 8px 4px 4px;
    box-shadow: 0 0 24px rgba(255,240,180,.7);
  }
  .scene .win::after { content: "☀"; position: absolute; top: 4px; right: 8px; color: #f2b13d; font-size: 15px; }
  .scene .sunbeam {
    position: absolute; top: 0; right: 16px; width: 280px; height: 100%;
    background: linear-gradient(205deg, rgba(255,232,170,.55) 0%, rgba(255,232,170,.16) 45%, transparent 65%);
    animation: lampf 4.5s ease-in-out infinite;
  }
  .scene .dogsrow {
    position: absolute; bottom: 22px; left: 0; width: 100%; display: flex; justify-content: center; gap: 26px; align-items: flex-end;
    transform-style: preserve-3d; transform-origin: bottom center; transform: rotateX(var(--tilt));
  }
  .scene .sceneprop { position: absolute; bottom: 30px; left: 26px; }
  .scene .sceneplant { position: absolute; bottom: 30px; right: 26px; }
  .scene img.sceneimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scene .scenecap {
    position: absolute; left: 0; bottom: 0; width: 100%; padding: 40px 22px 12px;
    background: linear-gradient(transparent, rgba(40,24,10,.72));
    color: #fdf6e0; z-index: 3;
  }
  .scene .scenecap .sf { font-size: 10px; letter-spacing: 3px; opacity: .85; }
  .scene .scenecap .sn { font-size: 21px; font-weight: 700; letter-spacing: 3px; margin-top: 2px; }
  .scene .scenecap .st { font-size: 12px; margin-top: 4px; opacity: .95; }
  .members { display: flex; border-top: 1px solid rgba(74,58,42,.12); }
  @media (max-width: 640px) { .members { flex-direction: column; } }
  .member { flex: 1; padding: 18px 16px; display: flex; align-items: center; gap: 12px; border-right: 1px solid rgba(74,58,42,.12); }
  .member:last-child { border-right: none; }
  .member svg { flex: 0 0 auto; }
  .member .mn { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
  .member .mb { font-size: 10px; color: var(--gold); margin-top: 2px; font-family: 'DotGothic16', monospace; }
  .member .mr { font-size: 12px; opacity: .85; margin-top: 3px; line-height: 1.6; }
  .member.advocate .mn { color: var(--terra); }

  /* ============ 受付窓口（困りごとセクション） ============ */
  .worrysec { background: linear-gradient(180deg, var(--paper2) 0%, #f2d8ab 100%); padding: 90px 18px; }
  .reception { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 40px; flex-wrap: wrap; }
  .reception .bubble {
    position: relative; background: #fff; border: 2px solid var(--gold); border-radius: 14px;
    padding: 14px 22px; font-size: 15px; line-height: 2.1; letter-spacing: 2px; max-width: 440px;
  }
  .reception .bubble::before {
    content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
    border: 8px solid transparent; border-right-color: var(--gold);
  }
  .worrycards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 940px; margin: 0 auto; }
  @media (max-width: 760px) { .worrycards { grid-template-columns: 1fr; } }
  .worrycard {
    background: #47342a; color: #f5e8cc; border-radius: 10px; padding: 16px 18px;
    cursor: pointer; border: 2px solid transparent; transition: transform .2s, border-color .2s, background .2s;
  }
  .worrycard:hover { transform: translateY(-3px); }
  .worrycard.sel { border-color: var(--gold); background: #5c4432; }
  .worrycard .wt { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .worrycard .ws { font-size: 11px; opacity: .75; margin-top: 6px; }
  /* --- おしごと劇場（クリックで進む紙芝居） --- */
  .flowpanel {
    max-width: 940px; margin: 28px auto 0; border-radius: 16px;
    box-shadow: 0 18px 50px rgba(90,60,20,.3); display: none; overflow: hidden;
  }
  .flowpanel.show { display: block; animation: panelin .5s ease; }
  @keyframes panelin { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .theater { position: relative; min-height: 440px; padding: 18px 20px 24px; perspective: 560px; }
  .th-head { display: flex; justify-content: space-between; align-items: flex-start; color: #fdf3e2; gap: 10px; flex-wrap: wrap; }
  .th-phase { font-size: 10px; letter-spacing: 3px; opacity: .9; }
  .th-room { font-size: 17px; font-weight: 700; letter-spacing: 2px; margin-top: 4px; }
  .th-prog { display: flex; gap: 5px; margin-top: 6px; }
  .th-prog span { width: 26px; height: 3px; background: rgba(255,255,255,.28); border-radius: 2px; }
  .th-prog span.on { background: #ffd88a; }
  .th-dogs {
    display: flex; justify-content: center; gap: 22px; align-items: flex-end; margin: 20px 0 14px; min-height: 96px;
    transform-style: preserve-3d; transform-origin: bottom center; transform: rotateX(var(--tilt));
  }
  .th-dogs svg { filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .th-card {
    background: rgba(28,19,11,.85); border: 1px solid rgba(255,216,138,.35); border-radius: 12px;
    color: #fdf3e2; padding: 16px 20px; max-width: 600px; margin: 0 auto;
  }
  .th-sp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .th-name { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .th-tag { font-size: 10px; opacity: .75; }
  .th-badge { margin-left: auto; font-size: 9px; letter-spacing: 2px; border: 1px solid #e8a05e; color: #ffc890; border-radius: 12px; padding: 2px 9px; white-space: nowrap; }
  .th-line { font-size: 16px; line-height: 2.1; letter-spacing: 1px; margin-top: 10px; }
  .th-body { font-size: 12px; line-height: 2; letter-spacing: 1px; margin-top: 8px; opacity: .85; }
  .th-foot { display: flex; align-items: center; margin-top: 14px; }
  .th-step { font-size: 11px; opacity: .75; letter-spacing: 2px; }
  .th-next {
    margin-left: auto; font-family: inherit; cursor: pointer;
    background: #ffe2ae; color: #4a3010; border: none; border-radius: 22px;
    padding: 9px 24px; font-size: 13px; letter-spacing: 2px; font-weight: 700;
  }
  .th-next:active { transform: translateY(2px); }
  .stampbtn {
    display: block; margin: 18px auto 4px; width: 112px; height: 112px; border-radius: 50%;
    background: #c9654a; color: #fff8ec; border: 4px solid #a34a34;
    font-family: inherit; font-size: 14px; letter-spacing: 3px; line-height: 1.8;
    cursor: pointer; box-shadow: 0 6px 0 #8a3c2a;
  }
  .stampbtn:active { transform: translateY(5px); box-shadow: 0 1px 0 #8a3c2a; }
  .th-complete { text-align: center; color: #fdf3e2; padding: 8px 0; }
  .stampmark {
    display: inline-block; border: 3px solid #ff9270; color: #ff9270;
    font-size: 22px; font-weight: 700; letter-spacing: 6px; padding: 8px 16px 8px 22px;
    transform: rotate(-12deg); border-radius: 6px; margin-bottom: 18px;
    animation: stampin .35s cubic-bezier(.2, 2.2, .6, 1);
  }
  @keyframes stampin { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
  .th-ctitle { display: inline-block; font-size: 12px; letter-spacing: 2px; border: 1px solid rgba(255,216,138,.5); border-radius: 20px; padding: 5px 16px; margin-bottom: 16px; }
  .th-cline { font-size: clamp(18px, 3vw, 26px); font-weight: 700; letter-spacing: 3px; line-height: 1.9; }
  .th-csub { font-size: 12px; letter-spacing: 1px; opacity: .8; margin-top: 14px; line-height: 2; }
  .th-cbtns { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .th-cbtns button, .th-cbtns a {
    font-family: inherit; font-size: 12px; letter-spacing: 2px; cursor: pointer;
    background: transparent; color: #fdf3e2; border: 1px solid rgba(253,243,226,.55);
    border-radius: 22px; padding: 9px 22px; text-decoration: none;
  }
  .th-cbtns button:hover, .th-cbtns a:hover { background: rgba(253,243,226,.12); }

  /* ============ 夕暮れの締めセクション ============ */
  .nightsec {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, #e8a05e 0%, #c9707a 32%, #8a5578 62%, #4a3560 100%);
    color: #fdf3e2; text-align: center; padding: 130px 18px 90px;
  }
  .nightsec h2, .nightsec .body { text-shadow: 0 1px 12px rgba(60,30,40,.35); }
  .nightsec .stars span { position: absolute; color: #cdbfff; animation: twinkle 3s infinite; }
  @keyframes twinkle { 0%,100% { opacity: .1; } 50% { opacity: .9; } }
  .nightsec .kicker { font-size: 11px; letter-spacing: 5px; opacity: .7; margin-bottom: 30px; }
  .nightsec h2 { font-size: clamp(24px, 4.6vw, 40px); font-weight: 700; letter-spacing: 4px; line-height: 1.9; }
  .nightsec .body { max-width: 700px; margin: 40px auto 0; font-size: 15px; line-height: 2.4; letter-spacing: 2px; }
  .nightsec .fin { margin-top: 70px; font-size: 14px; letter-spacing: 4px; color: #e8c15a; }
  .nightsec .fin2 { margin-top: 12px; font-size: 10px; letter-spacing: 3px; opacity: .6; }
  .nightsec .links { margin-top: 46px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .nightsec .links a {
    color: var(--nightink); text-decoration: none; font-size: 12px; letter-spacing: 2px;
    border: 1px solid rgba(240,223,184,.5); border-radius: 24px; padding: 9px 22px;
    transition: background .3s;
  }
  .nightsec .links a:hover { background: rgba(240,223,184,.14); }

  .fadein { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform .9s ease; }
  .fadein.visible { opacity: 1; transform: translateY(0); }

  /* --- アクセシビリティ --- */
  .dirrow:focus-visible, .worrycard:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .membermore { text-align: center; font-size: 11px; color: var(--gold); padding: 8px 0 12px; border-top: 1px solid rgba(74,58,42,.12); }
  .nightsec .fin3 { margin-top: 18px; font-size: 10px; letter-spacing: 1px; opacity: .7; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="brandbar">
  <div class="b1" id="brandName"></div>
  <div class="b2" id="brandSub"></div>
</div>
<div class="timemeter">
  <div class="tm-time" id="tmTime">06:00</div>
  <div class="tm-label" id="tmLabel">あさ</div>
  <div class="tm-line"></div>
  <div class="tm-foot">DAYTIME</div>
</div>

<div id="page"></div>

<script>
// ================================================================
//  ★ 物語の設定（ここを書き換えれば、別の業種・別の会社にも使えます）
// ================================================================
const STORY = {
  brand: "HIMARI COMPANY",
  brandSub: "ON THE SUNNY HILL ・ 32 DOGS AT WORK",
  heroLead: "あさ6時すぎ。丘の上のオフィスは、今日もしっぽ日和。",
  heroTitle: ["陽だまりの丘の、", "ちいさなオフィス"],
  heroSub: "丘の上の一軒家で、32匹の犬のAI社員が今日も働いています。",
  captionChip: "しっぽの数だけ、片づく雑務。",
  dirKicker: "FLOOR GUIDE",
  dirHead: "フロアのご案内",
  dirNote: "ほとんどの部署に「品質係」の犬がいます。できあがった仕事を、まず疑ってみるのが役目です。",
  deptKicker: "DEPARTMENTS",
  closing: {
    kicker: "HIMARI COMPANY ／ HUMAN IN THE LOOP",
    title: ["犬たちの仕事は、あなたから", "仕事を奪うことではありません。"],
    body: "めんどうな仕事は犬たちが引き受けます。あなたの手もとに残るのは、あなたにしかできない判断と、大切な相手と向き合う時間。丘の犬たちがしっぽを振りつづけるのは、AIの自慢のためではなく、あなたの毎日にすこしのゆとりをつくるためです。",
    fin: "陽だまりの丘の、ちいさなオフィス",
    fin2: "HIMARI COMPANY ・ 32 DOGS AT WORK ・ YOU MAKE THE CALL",
  },
  links: [],
};

// ================================================================
//  ★ 画像差し替え（後でAI生成画像にできる。書き方は 画像差し替えガイド.md 参照）
//  画像ファイルを images/ に置いて、ここに1行足すだけ。消せばドット絵に戻る。
// ================================================================
// 部屋の情景（部署カードの背景）＋ヒーローの建物
// 例： "hero": "images/hero.png",  "秘書室": "images/scene/秘書室.png",
const SCENE_IMAGES = {
};
// キャラクター（ドット絵の犬の代わりに表示。透過PNG推奨）
// 例： "morning": "images/char/morning.png",
const CHAR_IMAGES = {
  "claude": "images/char/claude.png",

function hashCode(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
function dogRects(id, P, offX) {
  const br = BREEDS[id] || { a:"floppy", C:"#c98a4b", D:"#8a5a2b", M:"#f2e6d0" };
  const map = ARCHETYPES[br.a];
  const h = hashCode(id);
  const colorOf = (c, x, y) => {
    if (c === "M") return br.M || br.C;
    if (c === "F") return br.F || br.C;
    if (c === "D") return br.D || br.C;
    if (br.spots && ((x * 7 + y * 13 + h) % 8 === 0)) return br.D;
    return br.C;
  };
  let body = "";
  map.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (c === ".") return;
      const col = c === "E" ? "#1e1a14" : c === "N" ? "#26201a" : colorOf(c, x, y);
      body += `<rect x="${x*P+offX}" y="${y*P}" width="${P}" height="${P}" fill="${col}"/>`;
    });
  });
  return { body, rows: map.length };
}
function deskDogSVG(id, P) {
  P = P || 6;
  const W = 14 * P;
  const offX = P;
  const d = dogRects(id, P, offX);
  const deskY = d.rows * P - P * 0.4;
  return `<svg class="dogsvg" width="${W}" height="${deskY + 2*P}" xmlns="http://www.w3.org/2000/svg">
    ${d.body}
    <rect x="0" y="${deskY}" width="${W}" height="${1.2*P}" fill="#7a5a36"/>
    <rect x="0" y="${deskY+1.2*P}" width="${W}" height="${0.6*P}" fill="#5c4228"/>
    <rect x="${2.8*P}" y="${deskY-1.4*P}" width="${3.4*P}" height="${1.4*P}" fill="#f5f0e0" stroke="#b5a184" stroke-width="1"/>
  </svg>`;
}
function faceDogSVG(id, P) {
  P = P || 4;
  const d = dogRects(id, P, 0);
  return `<svg class="dogsvg" width="${12*P}" height="${d.rows*P}" xmlns="http://www.w3.org/2000/svg">${d.body}</svg>`;
}

// 画像があれば画像、なければドット絵（CHAR_IMAGES に1行足すだけで差し替わる）
function charFace(id, P) {
  if (CHAR_IMAGES[id]) return `<img src="${CHAR_IMAGES[id]}" alt="" style="width:${12*P}px;height:${12*P}px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(74,58,42,.45))">`;
  return faceDogSVG(id, P);
}
function charDesk(id, P) {
  if (CHAR_IMAGES[id]) return `<img src="${CHAR_IMAGES[id]}" alt="" style="width:${14*P}px;height:${13*P}px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(74,58,42,.45))">`;
  return deskDogSVG(id, P);
}
function sunflowerSVG(P) {
  P = P || 5;
  const map = ["..Y.YY.Y..","..YOOOOY..",".YOBBBBOY.",".YOBBBBOY.","..YOOOOY..","..Y.YY.Y..","....GG....","..G.GG....","....GG.G..","....GG...."];
  const pal = { Y:"#f2c13d", O:"#e8a825", B:"#6b4a26", G:"#5c8a4e" };
  let rects = "";
  map.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === "." || !pal[c]) return;
    rects += `<rect x="${x*P}" y="${y*P}" width="${P}" height="${P}" fill="${pal[c]}"/>`;
  }));
  return `<svg width="${10*P}" height="${10*P}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

const flowpanel = worry.querySelector("#flowpanel");
const BEAT_LABELS = ["おねがいの受けわたし", "おしごと中", "まったをかける", "たてなおし", "バトンをあなたへ"];
const TH_TIMES = ["10:00", "10:03", "10:06", "10:09", "10:12", "10:15", "10:16"];
let th = null; // { w: 選ばれた困りごと, idx: 0-4=リレー / 5=最終判断 / 6=完了 }

function theaterHTML() {
  const w = th.w, idx = th.idx;
  const room = roomByName[w.dept];
  const phase = idx < 5 ? (idx === 0 ? "MORNING CALL" : "PAW RELAY ・ 0" + idx)
              : idx === 5 ? "YOUR CALL" : "WELL DONE";
  const prog = Array.from({ length: 7 }, (_, i) => `<span class="${i <= idx ? "on" : ""}"></span>`).join("");
  const bg = THEATER_IMAGES[w.dept]
    ? `background: linear-gradient(rgba(30,20,12,.5), rgba(30,20,12,.72)), url('${THEATER_IMAGES[w.dept]}') center/cover`
    : `background: linear-gradient(180deg, ${room.color}55 0%, #4a3322 55%, #2e2014 100%)`;
  let mid = "";
  if (idx < 5) {
    const b = w.beats[idx];
    const dogs = room.members.slice(0, 4).map(m => `<div class="billboard">${charDesk(m.id, 6)}</div>`).join("");
    mid = `<div class="th-dogs">${dogs}</div>
      <div class="th-card">
        <div class="th-sp">${charFace(b.id, 3)}<span class="th-name">${b.n}</span><span class="th-tag">${b.tag}</span>${b.badge ? `<span class="th-badge">${b.badge}</span>` : ""}</div>
        <div class="th-line">「${b.line}」</div>
        <div class="th-foot"><span class="th-step">${idx + 1} / 5　${BEAT_LABELS[idx]}</span><button class="th-next" id="thNext">つづきへ</button></div>
      </div>`;
  } else if (idx === 5) {
    mid = `<div class="th-dogs">${charFace("claude", 6)}</div>
      <div class="th-card" style="text-align:center">
        <div class="th-sp" style="justify-content:center"><span class="th-badge" style="margin:0 auto">OWNER'S DESK ・ NO DOGS ALLOWED</span></div>
        <div class="th-line">「さいごの一手は、あなたのもの。」</div>
        <div class="th-body">調べる・つくる・疑うまでが、犬たちの仕事。<br>「これでいく」のひと声だけは、あなたにしか出せません。</div>
        <button class="stampbtn" id="thStamp">🐾<br>あなたが<br>承 認</button>
      </div>`;
  } else {
    const c = w.complete;
    mid = `<div class="th-complete">
      <div><span class="stampmark">承 認</span></div>
      <div><span class="th-ctitle">できあがったもの：${c.title}</span></div>
      <div class="th-cline">${c.line}</div>
      <div class="th-csub">${c.sub || ""}</div>
      <div class="th-cbtns"><button id="thRetry">ほかの困りごとをえらぶ</button></div>
    </div>`;
  }
  return `<div class="theater" style="${bg}">
    <div class="th-head">
      <div><div class="th-phase">${phase} ・ ${TH_TIMES[idx]}</div><div class="th-room">${idx === 5 ? "オーナーズデスク" : w.dept}</div></div>
      <div class="th-prog">${prog}</div>
    </div>
    ${mid}
  </div>`;
}

function renderTheater() {
  flowpanel.innerHTML = theaterHTML();
  const next = flowpanel.querySelector("#thNext");
  if (next) next.addEventListener("click", () => { th.idx++; renderTheater(); });
  const stamp = flowpanel.querySelector("#thStamp");
  if (stamp) stamp.addEventListener("click", () => { th.idx++; renderTheater(); });
  const retry = flowpanel.querySelector("#thRetry");
  if (retry) retry.addEventListener("click", () => {
    th = null;
    flowpanel.classList.remove("show");
    worry.querySelectorAll(".worrycard").forEach(c => c.classList.remove("sel"));
    worry.querySelector(".worrycards").scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

worry.querySelectorAll(".worrycard").forEach(card => {
  const start = () => {
    worry.querySelectorAll(".worrycard").forEach(c => c.classList.remove("sel"));
    card.classList.add("sel");
    th = { w: WORRIES[+card.dataset.i], idx: 0 };
    renderTheater();
    flowpanel.classList.add("show");
    flowpanel.scrollIntoView({ behavior: "smooth", block: "center" });
  };
  card.addEventListener("click", start);
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } });
});

// ================================================================
//  スクロール演出（時刻メーター＋フェードイン）
// ================================================================
const tmTime = document.getElementById("tmTime");
const tmLabel = document.getElementById("tmLabel");
function updateTime() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  // 06:00 から 18:00 まで（お日さまと一緒の12時間）
  const totalMin = 6 * 60 + p * 12 * 60;
  const hh = Math.floor(totalMin / 60) % 24;
  const mm = Math.floor(totalMin % 60);
  tmTime.textContent = `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  tmLabel.textContent = hh < 10 ? "あさ" : hh < 15 ? "ひる" : "ゆうがた";
}
window.addEventListener("scroll", updateTime, { passive: true });
updateTime();

const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
}, { threshold: 0.12 });
document.querySelectorAll(".fadein").forEach(el => io.observe(el));
